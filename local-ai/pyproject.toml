[project]
name = "openhiggsfield-local-ai"
version = "0.1.0"
description = "Local, native inference platform for the OpenHiggsfield studio. Diffusers/PyTorch directly — no ComfyUI."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Installed separately from a CUDA index — see README. Blackwell (RTX 5090,
# sm_120) needs a CUDA 12.8 or newer build of torch.
gpu = [
  "torch>=2.7",
  "diffusers>=0.33",
  "transformers>=4.48",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "pillow>=10.3",
  "nvidia-ml-py>=12.560",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "anyio>=4",
]

[project.scripts]
local-ai = "server.main:main"
local-ai-models = "server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.routes", "server.services", "server.schemas", "engines", "engines.image"]

[tool.setuptools.package-data]
server = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
